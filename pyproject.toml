[project]
name = "onecx-pipecat"
version = "0.0.1"
description = "Pipecat application foundation for authenticated voice sessions."
requires-python = ">=3.11,<4.0"
dependencies = [
    "pipecat-ai[mcp,anthropic,aws]>=1.8.0,<1.9.0",
    "fastapi>=0.110,<1.0.0",
    "uvicorn[standard]>=0.29,<1.0.0",
    "pydantic>=2.6,<3.0.0",
    "pydantic-settings>=2.2,<3.0.0",
    "httpx>=0.27,<1.0.0",
    "pyjwt[crypto]>=2.8,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0.0",
    "pytest-asyncio>=0.23,<1.0.0",
    "pytest-cov>=5.0,<7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
# Coverage is collected only for the application package; tests and the
# virtualenv are excluded. ``--cov`` is enabled in CI and in local runs that
# pass it explicitly, so the default invocation stays unchanged.
addopts = ""

[tool.coverage.run]
source = ["onecx_pipecat"]
branch = true

[tool.coverage.report]
# Line/branch totals are reported in the CI job summary; no hard gate here so
# the workflow does not fail on a number. Review the trend per PR.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
