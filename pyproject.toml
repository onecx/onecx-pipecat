[project]
name = "onecx-pipecat"
version = "0.0.1"
description = "Pipecat application foundation for authenticated voice sessions."
requires-python = ">=3.11,<4.0"
dependencies = [
    "pipecat-ai[mcp,anthropic,aws]>=1.8.0,<1.9.0",
    "fastapi>=0.110,<1.0.0",
    "uvicorn[standard]>=0.29,<1.0.0",
    "pydantic>=2.6,<3.0.0",
    "pydantic-settings>=2.2,<3.0.0",
    "httpx>=0.27,<1.0.0",
    "pyjwt[crypto]>=2.8,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0.0",
    "pytest-asyncio>=0.23,<1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
